<!DOCTYPE html>
<html lang="uz">
<head><style>
body{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;transition:background 0.3s;font-family:sans-serif}
input[type=color]{width:60px;height:40px;cursor:pointer;border:none}
</style></head>
<body><h2 id="txt">Fon rangini tanlang</h2>
<input type="color" id="clr" value="#3498db" oninput="document.body.style.background=this.value;document.getElementById('txt').textContent='Tanlangan: '+this.value">
</body></html>
